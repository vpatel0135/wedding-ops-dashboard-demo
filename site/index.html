<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Event Ops Operations">
<title>Event Operations — Interactive Portfolio Demo</title>

<style>
:root{
  
  --bg:#f3f8ff;          
  --bg-2:#e7f0ff;        
  --card:rgba(255,255,255,0.78);
  --card-border:rgba(20,68,128,0.14);
  --card-hi:rgba(255,255,255,0.96);
  --teal:#1769e0;        
  --teal-dim:#0f4cad;
  --blue:#4f8dff;        
  --ink:#10243f;
  --ink-dim:#45627f;
  --ink-faint:#5c7691;
  --green:#16836d;
  --yellow:#d86a35;
  --red:#bb3f45;
  --gray:#91a6bd;
  --on-accent:#ffffff;
  
  --chrome-bg:#071c35;
  --chrome-bg-2:#0d2b50;      
  --chrome-border:rgba(255,255,255,0.08);
  --chrome-ink:#f6fbff;
  --chrome-ink-dim:#b9d0e9;
  --chrome-gold:#7ab7ff;      
  --chrome-coral:#ffb088;
  --radius:22px;
  --radius-sm:16px;
  --ease:cubic-bezier(.4,0,.2,1);
  --nav-h:64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  
  --serif:'Didot','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(47,126,255,0.15), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(98,191,255,0.13), transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100%;
  overflow-x:hidden;
}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:rgba(79,141,255,0.26);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(16,68,128,0.20);border-radius:8px;}


@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
    scroll-behavior:auto !important;
  }
}

.visually-hidden{
  position:absolute!important;width:1px;height:1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;
}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:8px;}


:root{--ops-motif:none; --ops-ornament:none; --ops-card-radius:18px; --ops-card-shadow:0 16px 34px -25px rgba(16,68,128,.24);}
#app{display:flex; min-height:100vh; position:relative; isolation:isolate; overflow:hidden; background:var(--ops-atmosphere,transparent); transition:background .32s var(--ease);}
#app::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background:var(--ops-motif); opacity:.9; transition:background .32s var(--ease),opacity .32s var(--ease);}
#app::after{content:""; position:fixed; z-index:0; pointer-events:none; width:min(42vw,520px); aspect-ratio:1; right:-130px; top:-150px; background:var(--ops-ornament); opacity:.7; transform:rotate(var(--ops-ornament-rotate,0deg)); transition:background .32s var(--ease),transform .32s var(--ease);}
.ops-theme-mehndi{--bg:#f2f9ef;--bg-2:#dcebd7;--card-border:rgba(45,104,56,.18);--teal:#347541;--teal-dim:#225a30;--blue:#6ba352;--chrome-bg:#0c2f1c;--chrome-bg-2:#17462b;--chrome-gold:#b8df82;--ops-card-radius:24px;--ops-atmosphere:radial-gradient(900px 520px at 22% -8%,rgba(104,170,76,.24),transparent 64%),linear-gradient(145deg,#f7fbf4,#edf6e9 55%,#e4f0df);--ops-motif:radial-gradient(circle at 18px 18px,rgba(54,119,63,.09) 2px,transparent 2.5px) 0 0/36px 36px;--ops-ornament:repeating-radial-gradient(circle at 50% 50%,transparent 0 20px,rgba(64,132,68,.13) 21px 23px,transparent 24px 39px);}
.ops-theme-vidhi{--bg:#fff7e6;--bg-2:#ffe9b7;--card-border:rgba(167,92,11,.18);--teal:#bd6507;--teal-dim:#874406;--blue:#e39a25;--chrome-bg:#3a2208;--chrome-bg-2:#60380c;--chrome-gold:#ffd064;--ops-card-radius:14px;--ops-atmosphere:radial-gradient(780px 520px at 72% -8%,rgba(244,168,34,.25),transparent 62%),linear-gradient(145deg,#fffaf0,#fff2d4 58%,#ffe9bd);--ops-motif:linear-gradient(45deg,transparent 47%,rgba(195,109,12,.055) 48% 52%,transparent 53%) 0 0/46px 46px,linear-gradient(-45deg,transparent 47%,rgba(195,109,12,.045) 48% 52%,transparent 53%) 0 0/46px 46px;--ops-ornament:conic-gradient(from 0deg,rgba(230,145,25,.18),transparent 8deg 22deg,rgba(230,145,25,.18) 23deg 30deg,transparent 31deg 45deg);--ops-ornament-rotate:10deg;}
.ops-theme-sangeet{--bg:#f8f2ff;--bg-2:#e7d9fb;--card-border:rgba(95,54,158,.2);--teal:#7747bd;--teal-dim:#503087;--blue:#c05fc9;--chrome-bg:#241039;--chrome-bg-2:#442064;--chrome-gold:#e0b7ff;--ops-card-radius:20px;--ops-atmosphere:radial-gradient(520px 420px at 82% 8%,rgba(236,94,186,.18),transparent 65%),radial-gradient(680px 520px at 22% -12%,rgba(117,71,191,.25),transparent 63%),linear-gradient(145deg,#fbf7ff,#f1e8fd 56%,#e8daf8);--ops-motif:radial-gradient(circle at 10% 20%,rgba(130,73,200,.11) 0 3px,transparent 4px),radial-gradient(circle at 70% 42%,rgba(221,85,176,.1) 0 2px,transparent 3px) 0 0/62px 62px;--ops-ornament:conic-gradient(from 45deg,transparent 0 12.5%,rgba(179,87,208,.15) 12.5% 25%,transparent 25% 37.5%,rgba(103,74,190,.15) 37.5% 50%,transparent 50% 62.5%,rgba(179,87,208,.15) 62.5% 75%,transparent 75% 87.5%,rgba(103,74,190,.15) 87.5%);--ops-ornament-rotate:15deg;}
.ops-theme-wedding{--bg:#fffaf8;--bg-2:#f5dfdc;--card-border:rgba(155,28,32,.19);--teal:#b1262c;--teal-dim:#7d171d;--blue:#d75355;--chrome-bg:#3d0b10;--chrome-bg-2:#68161c;--chrome-gold:#f4cf80;--ops-card-radius:22px 22px 10px 10px;--ops-atmosphere:radial-gradient(720px 480px at 78% -8%,rgba(183,35,40,.18),transparent 64%),linear-gradient(150deg,#fffdfb,#fff5f2 55%,#f7e5e1);--ops-motif:radial-gradient(ellipse at 50% 0,transparent 0 25px,rgba(177,38,44,.07) 26px 28px,transparent 29px) 0 0/86px 58px;--ops-ornament:radial-gradient(ellipse at 50% 100%,transparent 0 34%,rgba(169,29,35,.16) 35% 37%,transparent 38% 48%,rgba(216,172,85,.18) 49% 51%,transparent 52%);}
.ops-theme-reception{--bg:#eef2f7;--bg-2:#d8e0ea;--card-border:rgba(27,47,74,.22);--teal:#98742f;--teal-dim:#6d511c;--blue:#3d628f;--chrome-bg:#09182b;--chrome-bg-2:#142d4c;--chrome-gold:#e0c276;--ops-card-radius:8px;--ops-card-shadow:0 18px 38px -24px rgba(10,27,50,.38);--ops-atmosphere:radial-gradient(650px 460px at 72% -8%,rgba(214,181,101,.16),transparent 62%),linear-gradient(145deg,#f5f7fa,#e9eef4 56%,#dfe6ee);--ops-motif:linear-gradient(90deg,transparent 0 48%,rgba(39,67,101,.065) 49% 51%,transparent 52%) 0 0/72px 72px,linear-gradient(0deg,transparent 0 48%,rgba(39,67,101,.055) 49% 51%,transparent 52%) 0 0/72px 72px;--ops-ornament:repeating-radial-gradient(circle at 50% 50%,transparent 0 38px,rgba(205,169,84,.2) 39px 41px,transparent 42px 70px);--ops-ornament-rotate:45deg;}
.ops-theme-farewell{--bg:#f3f7f1;--bg-2:#dfe9dd;--card-border:rgba(55,96,65,.17);--teal:#557f60;--teal-dim:#395c43;--blue:#789b80;--chrome-bg:#193024;--chrome-bg-2:#2b4a36;--chrome-gold:#bfd1aa;--ops-card-radius:18px 30px 18px 30px;--ops-atmosphere:linear-gradient(180deg,#eef5ec 0,#f8faf6 38%,#e6eee3 100%);--ops-motif:linear-gradient(165deg,transparent 0 65%,rgba(84,127,94,.08) 66% 68%,transparent 69%) 0 0/80px 68px;--ops-ornament:radial-gradient(ellipse at 30% 60%,rgba(87,132,96,.15) 0 12%,transparent 13%),radial-gradient(ellipse at 62% 38%,rgba(87,132,96,.13) 0 10%,transparent 11%),linear-gradient(62deg,transparent 48%,rgba(87,132,96,.16) 49% 51%,transparent 52%);--ops-ornament-rotate:-12deg;}

#app.ops-theme-countdown{--bg:#f5f6f8;--bg-2:#e4e9f0;--card-border:rgba(43,65,94,.18);--teal:#405b7d;--teal-dim:#344d6c;--blue:#8298b6;--ink:#20334b;--ink-dim:#465b73;--ink-faint:#596b80;--chrome-bg:#17273c;--chrome-bg-2:#263c56;--chrome-gold:#d0dcec;--ops-card-radius:14px;--ops-atmosphere:radial-gradient(900px 520px at 90% -8%,rgba(130,152,182,.2),transparent 64%),linear-gradient(145deg,#fcfcfd,#eef1f6 55%,#e4e9f0);--ops-motif:linear-gradient(90deg,transparent calc(100% - 1px),rgba(43,65,94,.035) 0) 0 0/120px 120px;}
.ops-theme-mehndi{--ops-banner-bg:linear-gradient(125deg,#174b29,#397c43 60%,#75a957);--ops-banner-mark:"❦";}
.ops-theme-vidhi{--ops-banner-bg:linear-gradient(125deg,#713b05,#c56d0d 58%,#efae32);--ops-banner-mark:"✺";}
.ops-theme-sangeet{--ops-banner-bg:linear-gradient(125deg,#351657,#7747bd 54%,#c05fc9);--ops-banner-mark:"✦";}
.ops-theme-wedding{--ops-banner-bg:linear-gradient(125deg,#72151b,#b1262c 58%,#e06760);--ops-banner-mark:"❧";}
.ops-theme-reception{--ops-banner-bg:linear-gradient(125deg,#0b1c32,#24446b 58%,#98742f);--ops-banner-mark:"◇";}
.ops-theme-farewell{--ops-banner-bg:linear-gradient(125deg,#294c35,#557f60 60%,#93ac84);--ops-banner-mark:"↗";}
.app-main{flex:1; min-width:0; display:flex; flex-direction:column; position:relative; z-index:1;}
#app .card,#app .ptask,#app .studio-event-card{border-radius:var(--ops-card-radius); box-shadow:var(--ops-card-shadow);}
.event-theme-banner{position:relative; overflow:hidden; min-height:128px; margin-bottom:18px; padding:24px 28px; display:flex; align-items:center; border-radius:var(--ops-card-radius); color:#fff; background:var(--ops-banner-bg,linear-gradient(125deg,var(--chrome-bg),var(--teal))); box-shadow:0 22px 44px -28px var(--chrome-bg);}
.event-theme-banner::before{content:""; position:absolute; inset:0; background:linear-gradient(115deg,rgba(255,255,255,.1),transparent 42%),repeating-linear-gradient(135deg,transparent 0 24px,rgba(255,255,255,.035) 25px 26px);}
.event-theme-banner::after{content:var(--ops-banner-mark,"✦"); position:absolute; right:24px; top:50%; transform:translateY(-50%); font-size:86px; line-height:1; color:var(--chrome-gold); opacity:.28; font-family:Georgia,serif;}
.event-theme-banner-copy{position:relative; z-index:1;}
.event-theme-kicker{display:block; margin-bottom:7px; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--chrome-gold);}
.event-theme-banner h1{font-size:28px; line-height:1.08; letter-spacing:-.025em;}
.event-theme-date{display:block; margin-top:8px; font-size:13px; color:rgba(255,255,255,.76); font-weight:600;}
@media(max-width:620px){.event-theme-banner{min-height:112px;padding:20px;}.event-theme-banner h1{font-size:24px;}.event-theme-banner::after{right:12px;font-size:68px;}}
.view{
  display:none;
  padding:20px 16px calc(var(--nav-h) + 32px + var(--safe-bottom));
  max-width:960px;
  width:100%;
  margin:0 auto;
  animation:fadeIn .2s var(--ease);
}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}


.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  max-width:960px; margin:0 auto; width:100%;
  position:sticky; top:0; z-index:30;
  background:var(--chrome-bg);
  border-bottom:1px solid var(--chrome-border);
}
.brand{
  display:flex; align-items:center; gap:10px; background:none; border:none; color:var(--chrome-ink);
  cursor:pointer; padding:6px 4px; border-radius:12px;
}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--chrome-gold), var(--blue));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px; color:var(--chrome-bg);
  box-shadow:0 4px 16px rgba(122,183,255,0.28);
  flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.2;}
.brand-title{font-size:15px; font-weight:700; letter-spacing:.2px;}
.brand-sub{font-size:11px; color:var(--chrome-ink-dim); font-weight:500;}

.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--card-border);
  background:var(--card); color:var(--ink-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .15s var(--ease), background .15s var(--ease), color .15s var(--ease);
}
.icon-btn:hover{background:var(--card-hi); color:var(--ink); transform:translateY(-1px);}
.icon-btn svg{width:18px; height:18px;}

.topbar .icon-btn{background:var(--chrome-bg-2); border-color:var(--chrome-border); color:var(--chrome-ink-dim);}
.topbar .icon-btn:hover{background:#123a67; color:var(--chrome-ink);}
.topbar .demo-badge{background:rgba(122,183,255,0.14); border-color:rgba(122,183,255,0.5); color:var(--chrome-gold);}
.topbar .demo-badge-dot{background:var(--chrome-gold); box-shadow:0 0 4px rgba(122,183,255,.45);}

.search-pill{
  display:none;
  align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--card-border);
  border-radius:14px; padding:9px 14px; color:var(--ink-faint);
  cursor:pointer; min-width:220px; transition:border-color .15s var(--ease), background .15s var(--ease);
}
.search-pill:hover{background:var(--card-hi); border-color:rgba(16,68,128,0.19);}
.search-pill svg{width:16px;height:16px; flex-shrink:0;}
.search-pill .kbd{
  margin-left:auto; font-size:11px; padding:2px 6px; border-radius:6px;
  background:rgba(16,68,128,0.11); color:var(--ink-faint); font-weight:600;
}


.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:18px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 14px 28px -22px rgba(16,68,128,0.18);
  transition:transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
@media (hover:hover){
  .card.clickable:hover{transform:translateY(-2px); background:var(--card-hi); border-color:rgba(16,68,128,0.2); box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 18px 34px -22px rgba(16,68,128,0.22);}
}
.card.clickable{cursor:pointer;}
.card + .card{margin-top:12px;}
.section{margin-top:34px;}
.section:first-child{margin-top:0;}
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px; padding:0 2px;
}
.section-title{
  font-size:12.5px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-faint); font-weight:700;
}
.section-link{font-size:13px; color:var(--teal); font-weight:600; background:none; border:none; cursor:pointer;}

.grid{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:700px){ .grid.cols-2{grid-template-columns:1fr 1fr;} }
@media (min-width:960px){ .grid.cols-3{grid-template-columns:1fr 1fr 1fr;} }


.status-pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700; padding:4px 10px 4px 8px; border-radius:999px;
  letter-spacing:.02em; white-space:nowrap;
}
.status-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.status-green{background:rgba(116,139,103,0.14); color:var(--green);}
.status-green .status-dot{background:var(--green); box-shadow:0 0 4px rgba(116,139,103,.4);}
.status-yellow{background:rgba(190,91,61,0.14); color:var(--yellow);}
.status-yellow .status-dot{background:var(--yellow); box-shadow:0 0 4px rgba(190,91,61,.4);}
.status-red{background:rgba(162,59,46,0.14); color:var(--red);}
.status-red .status-dot{background:var(--red); box-shadow:0 0 4px rgba(162,59,46,.4);}
.status-blue{background:rgba(79,141,255,0.14); color:var(--blue);}
.status-blue .status-dot{background:var(--blue); box-shadow:0 0 4px rgba(79,141,255,.4);}
.status-gray{background:rgba(138,146,160,0.14); color:var(--gray);}
.status-gray .status-dot{background:var(--gray);}


.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; justify-content:space-around; align-items:center;
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(33,28,24,0.94);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--chrome-border);
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--chrome-ink-dim);
  font-size:11px; font-weight:600; padding:8px 10px; border-radius:12px;
  flex:1; max-width:110px; cursor:pointer; transition:color .15s var(--ease);
}
.nav-btn svg{width:22px; height:22px;}
.nav-btn.active{color:var(--chrome-gold);}
.nav-btn:active{transform:scale(.94);}



.sidebar{
  display:none;
  width:230px; flex-shrink:0;
  padding:22px 14px; border-right:1px solid var(--chrome-border);
  position:fixed; top:0; left:0; height:100vh; overflow-y:auto; z-index:15;
  flex-direction:column; gap:4px;
  background:var(--chrome-bg);
}
.sidebar::before{
  content:""; position:absolute; top:0; left:0; right:0; height:220px;
  background:radial-gradient(340px 220px at 20% -10%, rgba(122,183,255,0.10), transparent 70%);
  pointer-events:none;
}
.sidebar .brand{padding:6px 4px 22px; gap:8px; min-width:0; position:relative;}

.sidebar .brand-mark{width:28px; height:28px; font-size:12px;}
.sidebar .brand-text{min-width:0;}
.sidebar .brand-title{
  font-size:13px; letter-spacing:-.1px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%;
}
.side-btn{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:12px; border:none; background:none;
  color:var(--chrome-ink-dim); font-size:14.5px; font-weight:600; cursor:pointer;
  text-align:left; transition:background .15s var(--ease), color .15s var(--ease);
  position:relative;
}
.side-btn svg{width:19px; height:19px; flex-shrink:0;}
.side-btn:hover{background:var(--chrome-bg-2); color:var(--chrome-ink);}
.side-btn.active{background:rgba(122,183,255,0.13); color:var(--chrome-gold);}

.side-btn.active::before{
  content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--chrome-gold);
}
.side-search{
  margin-top:18px; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
}
.sidebar .search-pill{
  background:var(--chrome-bg-2); border:1px solid var(--chrome-border); color:var(--chrome-ink-dim);
}
.sidebar .search-pill:hover{background:#123a67; border-color:rgba(255,255,255,0.14);}
.sidebar .search-pill .kbd{background:rgba(255,255,255,0.08); color:var(--chrome-ink-dim);}
.side-footer{margin-top:auto; padding:10px; font-size:11.5px; color:var(--chrome-ink-dim); line-height:1.5;}
.sidebar .demo-badge{
  width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  justify-content:center; overflow:hidden; text-overflow:ellipsis;
  background:rgba(122,183,255,0.14); border-color:rgba(122,183,255,0.5); color:var(--chrome-gold);
  font-size:10px; letter-spacing:.025em;
}
.sidebar .demo-badge-dot{background:var(--chrome-gold); box-shadow:0 0 4px rgba(122,183,255,.45);}

@media (min-width:860px){
  .bottom-nav{display:none;}
  .sidebar{display:flex;}
  .topbar{display:none;}
  .view{padding:32px 40px 60px; max-width:1080px;}
  .search-pill{display:flex;}
  
  .app-main{margin-left:230px;}
}


.hero{
  border-radius:28px;
  padding:28px 24px 24px;
  background:linear-gradient(160deg, rgba(23,105,224,0.12), rgba(79,141,255,0.07) 55%, rgba(255,255,255,0.5));
  border:1px solid rgba(16,68,128,0.10);
  box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 24px 48px -30px rgba(16,68,128,0.22);
  position:relative; overflow:hidden;
}

.hero::after{

.reception-seating-actions{display:flex;flex-wrap:wrap;gap:8px;}
@media(max-width:540px){.card.reception-seating-shortcut{flex-wrap:wrap;padding:12px 14px;}.reception-seating-actions{width:100%;}.reception-seating-actions .btn{flex:1;justify-content:center;}}
.reception-floor-plan{margin:0 0 18px;padding:14px;border:1px solid var(--card-border);border-radius:14px;background:#fff;}
.reception-floor-plan summary{cursor:pointer;font-weight:700;}
.reception-floor-plan p{font-size:13px;color:var(--ink-faint);margin:8px 0;}
.reception-floor-plan img{display:block;width:100%;height:auto;margin-bottom:12px;}
.seating-tables{overflow-y:auto; overflow-x:hidden; padding:14px 16px calc(20px + var(--safe-bottom));}
.seating-table-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.seating-table-card{min-width:0; border:1px solid var(--card-border); border-radius:13px; background:rgba(16,68,128,.025); overflow:hidden;}
.seating-table-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px;}
.seating-table-number{font-size:14px; font-weight:800; color:var(--ink); font-family:var(--serif);}
.seating-table-count{font-size:11px; font-weight:700; color:var(--ink-faint); background:rgba(16,68,128,.08); padding:4px 10px; border-radius:999px; white-space:nowrap; flex-shrink:0;}
.seating-table-guests{display:flex; flex-direction:column; gap:0; padding:0 14px 12px; border-top:1px solid var(--card-border);}
.seating-table-guests span{display:block; padding:8px 0; border-bottom:1px dashed rgba(16,68,128,.1); font-size:13px; color:var(--ink-dim); word-break:break-word;}
.seating-table-guests span:last-child{border-bottom:0;}
.seating-empty{margin:4px 16px 18px; padding:16px; border-radius:14px; background:rgba(16,68,128,.05); color:var(--ink-dim); font-size:13.5px; line-height:1.5;}
@media (max-width:620px){
  .seating-panel-head{padding:14px 14px 0;}
  .seating-match{padding:0 14px;}
  .seating-tables{padding:12px 14px calc(20px + var(--safe-bottom));}
  .seating-table-grid{grid-template-columns:1fr;}
}




.pinput{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--card-border);
  background:rgba(16,68,128,0.08); color:var(--ink); font-size:13.5px; font-family:inherit;
}
.pinput:focus{outline:none; border-color:rgba(23,105,224,0.5);}
.presolve{margin-top:14px;}
.presolve-label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:6px;}
.nt-context{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px; font-weight:650;
  color:var(--ink-dim); margin-top:12px; padding:8px 12px; border-radius:10px; background:rgba(16,68,128,0.06);
}
.nt-context .chip{cursor:default; padding:3px 9px;}
.phowclose{font-size:13.5px; color:var(--ink-dim); line-height:1.55;}
.phowclose b{color:var(--teal); font-weight:650;}
.pdismissed{font-size:12.5px; color:var(--ink-faint); margin-top:10px; font-style:italic;}
.pcheckgrid{display:flex; flex-wrap:wrap; gap:7px;}
.pcheck{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
  border:1px solid var(--card-border); background:rgba(16,68,128,0.05);
  font-size:12.5px; color:var(--ink-dim); cursor:pointer; transition:all .15s var(--ease);
}
.pcheck input{accent-color:var(--teal); margin:0;}
.pcheck.on{background:rgba(23,105,224,0.12); color:var(--teal); border-color:rgba(23,105,224,0.4);}
.poption{
  padding:12px 14px; border-radius:12px; border:1px solid var(--card-border);
  background:rgba(16,68,128,0.04); margin-bottom:7px; cursor:pointer; transition:all .15s var(--ease);
}
.poption:hover{border-color:rgba(16,68,128,0.21);}
.poption.picked{border-color:rgba(23,105,224,0.5); background:rgba(23,105,224,0.09);}
.poption.chosen{border-color:rgba(116,139,103,0.4); background:rgba(116,139,103,0.07);}
.poption-label{font-size:13.5px; font-weight:650;}
.poption-note{font-size:12.5px; color:var(--ink-faint); margin-top:4px; line-height:1.45;}
.pnote{padding:11px 13px; border-radius:11px; background:rgba(16,68,128,0.055); margin-bottom:7px;}
.pnote-body{font-size:13px; color:var(--ink-dim); line-height:1.5;}
.pnote-meta{font-size:11px; color:var(--ink-faint); margin-top:5px;}
.pnote-add{display:flex; gap:7px; margin-top:10px;}
.pnote-add .pinput{flex:1;}
.drawer-src{font-size:11.5px; color:var(--ink-faint); margin-left:8px;}


.passignee-row{display:flex; gap:7px;}
.passignee-id{flex:1;}
select.pinput{appearance:none; cursor:pointer;}

.arole{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.06em; padding:3px 9px; border-radius:999px;
  border:1px solid var(--card-border); color:var(--ink-faint); flex-shrink:0;
}
.arole.role-primary{color:var(--teal); border-color:rgba(23,105,224,0.35); background:rgba(23,105,224,0.08);}
.arole.role-backup{color:var(--ink-dim);}
.arole.role-supporting{color:var(--ink-dim);}
.arole.role-vendorLiaison{color:var(--blue); border-color:rgba(79,141,255,0.32);}
.arole.role-familyCoordinator{color:#7b4985; border-color:rgba(123,73,133,0.32);}

.aresp{
  display:flex; align-items:flex-start; gap:11px; padding:12px 14px;
  border-radius:12px; border:1px solid var(--card-border); background:rgba(16,68,128,0.04);
  margin-bottom:7px;
}
.aresp-body{flex:1; min-width:0;}
.aresp-title{font-size:13.5px; font-weight:650; line-height:1.4;}
.aresp-title a, .aresp-title .chip{margin:0;}
.aresp-meta{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.aresp-instr{font-size:12.5px; color:var(--ink-dim); margin-top:6px; line-height:1.5; font-style:italic;}
.aresp-actions{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap;}
.aresp-actions .btn{padding:5px 11px; font-size:12px;}
.aresp-state{font-size:11.5px; color:var(--teal); font-weight:650;}


.updnext-card{
  padding:13px 15px; border-radius:14px; background:rgba(23,105,224,0.08);
  border:1px solid rgba(23,105,224,0.25);
}
.updnext-title{font-size:15px; font-weight:750; color:var(--ink);}
.updnext-meta{font-size:12.5px; color:var(--teal); margin-top:4px; font-weight:600;}


.day-status-strip{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:11px 15px; margin-bottom:16px; border-radius:12px;
  background:var(--card); border:1px solid var(--card-border);
  font-size:12.5px; color:var(--ink-dim);
}
.dss-item b{color:var(--ink); font-weight:750;}
.dss-item.is-current{color:var(--teal); font-weight:650;}
.dss-item.is-linked{color:var(--ink-dim); font-weight:650;}

.abrief-today-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 13px; border-radius:12px; background:rgba(23,105,224,0.07);
  border:1px solid rgba(23,105,224,0.22); margin-bottom:12px; font-size:12.5px; color:var(--teal); font-weight:650;
}
.abrief-today-toggle button{
  background:none; border:1px solid rgba(23,105,224,0.4); color:var(--teal);
  padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; cursor:pointer;
}
.abrief-empty{font-size:12.5px; color:var(--ink-faint); padding:4px 2px;}



.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 15px; border-radius:12px; border:1px solid var(--card-border);
  background:rgba(16,68,128,0.08); color:var(--ink); font-size:13.5px; font-weight:600;
  cursor:pointer; transition:transform .15s var(--ease), background .15s var(--ease);
  min-height:40px;
}
.btn svg{width:15px; height:15px;}
.btn:hover{background:rgba(16,68,128,0.15); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--teal), var(--teal-dim)); color:var(--on-accent); border-color:transparent; font-weight:700;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:rgba(162,59,46,0.14); color:var(--red); border-color:rgba(162,59,46,0.3);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px; font-size:12.5px; min-height:34px;}
.btn-text{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:none; border:none; color:var(--teal); font-size:13px; font-weight:650;
  cursor:pointer; padding:8px 4px; min-height:34px; transition:opacity .15s var(--ease);
}
.btn-text:hover{opacity:.75;}

.quick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:11px;}
@media (min-width:700px){.quick-grid{grid-template-columns:repeat(4,1fr);}}
.quick-btn{
  display:flex; flex-direction:column; align-items:flex-start; gap:13px;
  padding:17px 15px; border-radius:17px; border:1px solid var(--card-border);
  background:var(--card); color:var(--ink); cursor:pointer; text-align:left;
  box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 14px 28px -24px rgba(16,68,128,0.18);
  transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease);
}
.quick-btn:hover{background:var(--card-hi); transform:translateY(-2px); border-color:rgba(16,68,128,0.19);}
.quick-btn-icon{
  width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  background:rgba(23,105,224,0.14); color:var(--teal);
}
.quick-btn-icon svg{width:17px; height:17px;}
.quick-btn-label{font-size:13.5px; font-weight:700; line-height:1.3;}
.quick-btn-count{font-size:22px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; margin-top:-4px;}
.quick-btn-sub{font-size:12px; color:var(--ink-faint); line-height:1.4; font-weight:500; margin-top:-6px;}


.vcard{display:flex; align-items:center; gap:13px;}
.avatar{
  width:46px; height:46px; border-radius:13px; flex-shrink:0;
  background:linear-gradient(135deg, rgba(23,105,224,0.35), rgba(79,141,255,0.35));
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
}
.vcard-body{min-width:0; flex:1;}
.vcard-name{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.vcard-role{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
.vcard-meta{font-size:12px; color:var(--ink-dim); margin-top:4px;}
.vcard-actions{display:flex; gap:6px; flex-shrink:0;}
.circle-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--card-border);
  background:rgba(16,68,128,0.08); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink-dim);
}
.circle-btn:hover{background:rgba(16,68,128,0.15); color:var(--ink);}
.circle-btn svg{width:15px;height:15px;}


.alert-row{display:flex; align-items:flex-start; gap:13px;}
.alert-icon{
  width:32px; height:32px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  margin-top:1px;
}
.alert-icon svg{width:16px; height:16px;}
.alert-text{font-size:14px; font-weight:600; line-height:1.45;}
.alert-sub{font-size:12.5px; color:var(--ink-faint); margin-top:3px; line-height:1.4;}


.dir-cat{
  display:flex; align-items:center; gap:14px;
}
.dir-icon{
  width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:rgba(79,141,255,0.14); color:var(--blue); flex-shrink:0;
}
.dir-icon svg{width:19px; height:19px;}
.dir-title{font-size:15.5px; font-weight:700;}
.dir-count{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
.dir-chev{margin-left:auto; color:var(--ink-faint); display:flex;}
.dir-chev svg{width:17px; height:17px;}

.subgrid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px;}
@media (min-width:700px){.subgrid{grid-template-columns:1fr 1fr;}}


.overlay{
  position:fixed; inset:0; z-index:100; background:rgba(6,8,11,0.7);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:none; align-items:flex-start; justify-content:center;
  padding:0; opacity:0; transition:opacity .18s var(--ease);
}
.overlay.open{display:flex; opacity:1;}
.overlay-panel{
  width:100%; max-width:640px; background:var(--bg-2); border:1px solid var(--card-border);
  border-radius:0; box-shadow:0 20px 60px rgba(0,0,0,0.5);
  margin-top:0; max-height:100vh; display:flex; flex-direction:column;
  transform:translateY(-8px); transition:transform .2s var(--ease);
}
.overlay.open .overlay-panel{transform:translateY(0);}
@media (min-width:700px){
  .overlay{padding:70px 20px;align-items:flex-start;}
  .overlay-panel{border-radius:20px; max-height:74vh;}
}
.search-input-row{display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--card-border);}
.search-input-row svg{width:19px; height:19px; color:var(--ink-faint); flex-shrink:0;}
#search-input{
  flex:1; background:none; border:none; color:var(--ink); font-size:17px; outline:none;
}
#search-input::placeholder{color:var(--ink-faint);}
.search-close{background:none; border:none; color:var(--ink-faint); font-size:13px; font-weight:600; cursor:pointer; padding:6px 8px;}
.search-results{overflow-y:auto; padding:10px 8px 20px;}
.search-group-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding:12px 12px 6px;}
.search-result{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; cursor:pointer;
}
.search-result:hover, .search-result.active{background:var(--card-hi);}
.search-result-icon{
  width:36px; height:36px; border-radius:10px; background:rgba(16,68,128,0.08);
  display:flex; align-items:center; justify-content:center; color:var(--ink-dim); flex-shrink:0;
}
.search-result-icon svg{width:16px; height:16px;}
.search-result-title{font-size:14.5px; font-weight:700;}
.search-result-sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.search-empty{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}


.drawer-overlay{
  position:fixed; inset:0; z-index:110; background:rgba(6,8,11,0.6);
  display:none; opacity:0; transition:opacity .2s var(--ease);
}
.drawer-overlay.open{display:block; opacity:1;}
.drawer{
  position:fixed; right:0; top:0; bottom:0; z-index:111;
  width:100%; max-width:480px; background:var(--bg-2); border-left:1px solid var(--card-border);
  transform:translateX(100%); transition:transform .22s var(--ease);
  overflow-y:auto; padding:20px 20px calc(40px + var(--safe-bottom));
}
@media (max-width:520px){
  .drawer{max-width:100%; top:auto; height:92vh; border-radius:24px 24px 0 0; transform:translateY(100%); border-left:none; border-top:1px solid var(--card-border);}
  .drawer.open{transform:translateY(0)!important;}
}
.drawer.open{transform:translateX(0);}
.drawer-close-row{display:flex; justify-content:flex-end;}
.drawer-hero-icon{
  width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  color:var(--teal); background:linear-gradient(135deg, rgba(23,105,224,0.25), rgba(79,141,255,0.25));
  margin-bottom:16px;
}
.drawer-hero-icon svg{width:24px; height:24px;}
.drawer-title{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:-.005em;}
.drawer-subtitle{font-size:14px; color:var(--ink-faint); margin-top:4px;}
.drawer-section{margin-top:24px;}
.drawer-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:10px;}
.drawer-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid rgba(16,68,128,0.08); font-size:14px;}
.drawer-row:last-child{border-bottom:none;}
.drawer-row-label{color:var(--ink-faint);}
.drawer-row-value{font-weight:600; text-align:right;}
.drawer-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:10px;
  background:rgba(16,68,128,0.08); border:1px solid var(--card-border); cursor:pointer;
}
.chip:hover{background:rgba(16,68,128,0.15);}
.drawer-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px;}
.drawer-actions-top{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.drawer-actions-top .btn{flex:1 1 auto; min-width:120px;}
.drawer-actions-compact{margin-top:12px;}
.drawer-actions-compact .btn{flex:0 1 auto; min-width:0; padding:9px 14px;}


.drawer-disclosure{margin-top:18px;}
.drawer-disclosure > summary{
  cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px;
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
}
.drawer-disclosure > summary::-webkit-details-marker{display:none;}
.drawer-disclosure > summary::before{content:"▸"; font-size:10px; transition:transform .15s var(--ease);}
.drawer-disclosure[open] > summary::before{transform:rotate(90deg);}
.drawer-disclosure-body{margin-top:10px;}
.drawer-subsection-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:7px;}

.drawer-event-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-dim); margin-top:6px;}
.drawer-fact-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px;}
.drawer-owner-line{font-size:13px; color:var(--ink-dim); margin-top:8px; font-weight:600;}
.timeline-item-note-preview{
  margin-top:16px; padding:13px 14px; border-radius:14px;
  background:rgba(255,255,255,0.38); border:1px solid rgba(16,68,128,0.09);
}
.timeline-item-note-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:5px;}
.timeline-item-note-preview p{
  margin:0; color:var(--ink-dim); font-size:13.5px; line-height:1.45; white-space:pre-line;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
}

.timeline-item-audio{
  margin-top:16px; padding:13px 14px; border-radius:14px;
  background:rgba(255,255,255,0.38); border:1px solid rgba(16,68,128,0.09);
  display:flex; flex-direction:column; gap:12px;
}
.timeline-item-audio-track{display:flex; flex-direction:column; gap:6px;}
.timeline-item-audio-track + .timeline-item-audio-track{border-top:1px solid rgba(16,68,128,0.08); padding-top:12px;}
.timeline-item-audio-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);}
.timeline-item-audio-track audio{border-radius:8px;}
.timeline-item-audio-openlink{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
  color:var(--ink-dim); text-decoration:none; width:fit-content;
}
.timeline-item-audio-openlink svg{width:14px; height:14px;}
.timeline-item-audio-openlink:hover{color:var(--ink);}
.timeline-item-audio-links{display:flex; flex-wrap:wrap; gap:12px;}
.timeline-detail-group + .timeline-detail-group{border-top:1px solid rgba(16,68,128,0.08); margin-top:16px; padding-top:16px;}
.timeline-detail-copy{font-size:13.5px; color:var(--ink-dim); margin:0;}
.timeline-detail-copy.attention{color:var(--yellow);}

.pm-banner{
  background:linear-gradient(90deg, rgba(190,91,61,0.16), rgba(190,91,61,0.05));
  border:1px solid rgba(190,91,61,0.35); color:var(--yellow);
  border-radius:14px; padding:10px 14px; font-size:13px; font-weight:700;
  display:flex; align-items:center; gap:8px; margin-bottom:18px;
}
.pm-banner button{margin-left:auto; background:none; border:none; color:var(--yellow); font-weight:700; cursor:pointer; font-size:12.5px;}

.sim-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (min-width:600px){.sim-grid{grid-template-columns:1fr 1fr 1fr;}}
.sim-btn{

.guest-header{

.guest-nav{display:flex; gap:22px;}

.guest-nav-link.active{color:var(--g-ink);}

.guest-preview-banner{max-width:640px; margin:0 auto; padding:14px 24px 0; text-align:center;}

}

.guest-hero{
  max-width:640px; margin:0 auto; padding:76px 24px 32px; text-align:center; position:relative;
  background:radial-gradient(520px 320px at 50% 0%, rgba(129,183,245,0.32), transparent 70%);
}
.guest-hero::before{
  content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:180px; height:90px;

.guest-hero-eyebrow{

.guest-hero-date{font-size:15px; color:var(--g-ink-dim); font-weight:500;}

.guest-countdown{

.guest-hero-next{font-size:14px; color:var(--g-ink-dim); margin-top:10px;}
.guest-btn{
  display:inline-flex; align-items:center; gap:8px; margin-top:28px;

.guest-btn svg{width:15px; height:15px;}
.guest-btn-outline{
  background:none; color:var(--g-ink); border:1px solid var(--g-line); margin-top:18px;
}

.guest-section{max-width:640px; margin:0 auto; padding:40px 24px;}

.guest-section-top{padding-top:56px;}
.guest-section-center{text-align:center;}
.guest-eyebrow{

}
.guest-heading{font-family:var(--g-serif); font-weight:400; font-size:32px; margin:0 0 24px;}

.guest-schedule-back{

.guest-event{margin-bottom:26px;}

.guest-event-head{margin-bottom:10px;}
.guest-event-title{font-family:var(--g-serif); font-size:19px; color:var(--g-ink);}

.guest-moments{display:flex; flex-direction:column;}

.guest-footer{

.guest-team-link{

@media (min-width:700px){
  .guest-details-grid{grid-template-columns:repeat(4,1fr);}

function reconcileChecklistTasks(targetPlanning){
  if(!targetPlanning || typeof planningSeed === "undefined") return false;
  const canonical = (planningSeed.tasks||[]).filter(t=>String(t.sourceId||"").startsWith("wedding-checklist::"));
  const canonicalIds = new Set(canonical.map(t=>t.sourceId));
  const existing = new Map((targetPlanning.tasks||[]).filter(t=>t.sourceId).map(t=>[t.sourceId,t]));
  let changed = false;
  targetPlanning.tasks = (targetPlanning.tasks||[]).filter(t=>{
    if(!String(t.sourceId||"").startsWith("wedding-checklist::")) return true;
    const keep = canonicalIds.has(t.sourceId);
    if(!keep) changed = true;
    return keep;
  });
  const sourceFields = ["title","detail","priority","group","ownerId","dueDate","scope","scopeEventId","blocksEventId"];
  canonical.forEach(seed=>{
    const current = existing.get(seed.sourceId);
    if(!current){ targetPlanning.tasks.push(JSON.parse(JSON.stringify(seed))); changed = true; return; }
    
    if(current.status !== "done" && current.status !== "dismissed" && current.status !== seed.status){
      current.status = seed.status;
      changed = true;
    }
    sourceFields.forEach(field=>{
      const next = seed[field] == null ? null : seed[field];
      const prev = current[field] == null ? null : current[field];
      if(JSON.stringify(prev) !== JSON.stringify(next)){ current[field] = next; changed = true; }
    });
  });
  return changed;
}

const CANONICAL_VENUE_FIELDS = ["id","name","kind","address","contactName","phone","eventIds","parkingNotes"];
function venueRecordMatchesCanonical(record, canonical){
  if(!record) return false;
  return CANONICAL_VENUE_FIELDS.every(f=>{
    const a = record[f], b = canonical[f];
    if(Array.isArray(b)) return Array.isArray(a) && a.length===b.length && a.every((v,i)=>v===b[i]);
    return a === b;
  });
}

function isCanonicalVenueSet(venues){
  if(!Array.isArray(venues) || venues.length !== CANONICAL_VENUE_IDS.length) return false;
  return CANONICAL_VENUE_IDS.every(id=>{
    const matches = venues.filter(v=>v && v.id===id);
    return matches.length === 1 && venueRecordMatchesCanonical(matches[0], weddingData.venues.find(v=>v.id===id));
  });
}

function sanitizeVenueTimelineData(d, p, opts){
  if(!d) return false;
  const fullTimelineReset = !!(opts && opts.fullTimelineReset);
  let changed = false;
  if(!isCanonicalVenueSet(d.venues)){
    d.venues = weddingData.venues.map(v=>JSON.parse(JSON.stringify(v)));
    changed = true;
  }
  (d.events||[]).forEach(e=>{
    if(Object.prototype.hasOwnProperty.call(LEGACY_VENUE_ID_REMAP, e.venueId)){
      e.venueId = LEGACY_VENUE_ID_REMAP[e.venueId];
      changed = true;
    }
  });
  const staleItemIds = fullTimelineReset
    ? new Set((d.timelineItems||[]).map(t=>t.id))
    : new Set((d.timelineItems||[]).filter(t=>LEGACY_DEMO_TIMELINE_ITEM_IDS.has(t.id)).map(t=>t.id));
  if(staleItemIds.size){
    d.timelineItems = (d.timelineItems||[]).filter(t=>!staleItemIds.has(t.id));
    d.assignments = (d.assignments||[]).filter(a=>!(a.targetType==="timelineItem" && staleItemIds.has(a.targetId)));
    changed = true;
  }
  if(p){
    const beforeCount = (p.notes||[]).length + (p.decisions||[]).length + (p.tasks||[]).length;
    if(staleItemIds.size){
      p.notes = (p.notes||[]).filter(n=>!(n.entityType==="timelineItem" && staleItemIds.has(n.entityId)));
      p.decisions = (p.decisions||[]).filter(dd=>!(dd.entityType==="timelineItem" && staleItemIds.has(dd.entityId)));
      p.tasks = (p.tasks||[]).filter(t=>!(t.entityType==="timelineItem" && staleItemIds.has(t.entityId)));
    }
    [p.notes||[], p.decisions||[]].forEach(list=>list.forEach(rec=>{
      if(rec.entityType==="venue" && Object.prototype.hasOwnProperty.call(LEGACY_VENUE_ID_REMAP, rec.entityId)){
        rec.entityId = LEGACY_VENUE_ID_REMAP[rec.entityId] || rec.entityId;
        changed = true;
      }
    }));
    if((p.notes||[]).length + (p.decisions||[]).length + (p.tasks||[]).length !== beforeCount) changed = true;
  }
  return changed;
}


function pruneDanglingTimelineRefs(d, p, removedIds){
  if(!removedIds || !removedIds.size) return;
  d.assignments = (d.assignments||[]).filter(a=>!(a.targetType==="timelineItem" && removedIds.has(a.targetId)));
  if(p){
    p.notes = (p.notes||[]).filter(n=>!(n.entityType==="timelineItem" && removedIds.has(n.entityId)));
    p.decisions = (p.decisions||[]).filter(dd=>!(dd.entityType==="timelineItem" && removedIds.has(dd.entityId)));
    p.tasks = (p.tasks||[]).filter(t=>!(t.entityType==="timelineItem" && removedIds.has(t.entityId)));
  }
}


function reconcileSourceTimelineItems(d, p, opts){
  if(!d) return false;
  const isFirstImport = !!(opts && opts.isFirstImport);
  
  const canonical = CANONICAL_SHEET_TIMELINE_ITEMS;
  const existing = d.timelineItems || [];

  if(isFirstImport){
    const oldIds = existing.map(t=>t.id).slice().sort();
    const newIds = canonical.map(c=>c.id).slice().sort();
    if(oldIds.length === newIds.length && oldIds.every((id,i)=>id===newIds[i])) return false; // already exactly canonical
    const removed = new Set(existing.map(t=>t.id).filter(id=>!canonical.some(c=>c.id===id)));
    d.timelineItems = canonical.map(c=>JSON.parse(JSON.stringify(c)));
    pruneDanglingTimelineRefs(d, p, removed);
    return true;
  }

  const canonicalById = new Map(canonical.map(c=>[c.id, c]));


  const renamedSources = {};
  let renamed = false;
  existing.forEach(t=>{
    const replacement = canonical.find(c=>c.sourceId === renamedSources[t.sourceId]);
    if(!replacement || existing.some(other=>other.id === replacement.id)) return;
    const oldId = t.id;
    t.id = replacement.id;
    t.sourceId = replacement.sourceId;
    (d.assignments||[]).forEach(a=>{
      if(a.targetType === "timelineItem" && a.targetId === oldId) a.targetId = t.id;
    });
    if(p) [p.notes||[], p.decisions||[], p.tasks||[]].forEach(list=>list.forEach(rec=>{
      if(rec.entityType === "timelineItem" && rec.entityId === oldId) rec.entityId = t.id;
    }));
    renamed = true;
  });
  const existingSourceManaged = existing.filter(t=>t.sourceId);
  const existingNonSource = existing.filter(t=>!t.sourceId);
  const SOURCE_DERIVED_FIELDS = ["eventId","time","title","notes","sourceRow","sourceTimeLabel","sourceDateLabel","sourceTab","venueId","audience","kind","guestTitle","guestSubMoments","audioTracks"];

  let changed = renamed;
  const keptSourceManaged = [];
  existingSourceManaged.forEach(t=>{
    const c = canonicalById.get(t.id);
    if(!c){ changed = true; return; } // this source row no longer exists in the refreshed sheet — drop it
    const merged = Object.assign({}, t);
    SOURCE_DERIVED_FIELDS.forEach(f=>{ merged[f] = c[f]; });
    if(JSON.stringify(merged) !== JSON.stringify(t)) changed = true;
    keptSourceManaged.push(merged);
  });
  const removedIds = new Set(existingSourceManaged.filter(t=>!canonicalById.has(t.id)).map(t=>t.id));
  const keptIds = new Set(keptSourceManaged.map(t=>t.id));
  const insertedFresh = canonical.filter(c=>!keptIds.has(c.id)).map(c=>JSON.parse(JSON.stringify(c)));
  if(insertedFresh.length) changed = true;
  if(!changed) return false;

  d.timelineItems = [...existingNonSource, ...keptSourceManaged, ...insertedFresh];
  pruneDanglingTimelineRefs(d, p, removedIds);
  return true;
}

  return new Date(d).toLocaleDateString('en-US', opts || {weekday:'long', month:'long', day:'numeric'});

function displayTimeLabel(item){

function normalizeTimeLabel(raw){
  if(typeof raw === "number" && Number.isFinite(raw)) {
    const minutes = Math.floor(((raw % 1 + 1) % 1) * 1440 + 1e-7);
    return `${Math.floor(minutes / 60) % 12 || 12}:${String(minutes % 60).padStart(2,"0")} ${minutes < 720 ? "AM" : "PM"}`;
  }
  if(typeof raw !== "string") return raw;
  const TIME_RE = /^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*([AaPp][Mm])?$/;
  const parseToken = (tok) => {
    const m = tok.trim().match(TIME_RE);
    if(!m || Number(m[1]) > 23 || Number(m[2]) > 59) return null;
    return {hour: parseInt(m[1], 10), minute: m[2], meridiem: m[3] ? m[3].toUpperCase() : null};
  };
  
  const toMin = (t, meridiem) => ((t.hour % 12) + (meridiem === "PM" ? 12 : 0)) * 60 + parseInt(t.minute, 10);
  const fmt = (t) => `${t.hour % 12 || 12}:${t.minute} ${t.meridiem}`;
  const rangeMatch = raw.match(/^\s*(.+?)\s*[-\u2013\u2014]\s*(.+?)\s*$/);
  if(rangeMatch){
    const start = parseToken(rangeMatch[1]);
    const end = parseToken(rangeMatch[2]);
    if(start && end){
      
      if(!start.meridiem && end.meridiem){
        const same = end.meridiem, other = same === "AM" ? "PM" : "AM";
        start.meridiem = toMin(start, same) <= toMin(end, end.meridiem) ? same : other;
      } else if(!end.meridiem && start.meridiem){
        const same = start.meridiem, other = same === "AM" ? "PM" : "AM";
        end.meridiem = toMin(end, same) >= toMin(start, start.meridiem) ? same : other;
      }
      if(!start.meridiem && !end.meridiem) {
        start.meridiem = start.hour < 12 ? "AM" : "PM";
        end.meridiem = end.hour < 12 ? "AM" : "PM";
      }
      if(start.meridiem && end.meridiem) return `${fmt(start)} \u2013 ${fmt(end)}`;
    }
  }
  const single = parseToken(raw);
  if(single){
    single.meridiem ||= single.hour < 12 ? "AM" : "PM";
    return fmt(single);
  }

  return raw.replace(/\b(\d{1,2}):(\d{2}):\d{2}(?:\.\d+)?/g, "$1:$2");
}

  return new Date(d).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true});

function endTimeOf(item){
  const start = new Date(item.time).getTime();
  const sorted = allItemsSorted();
  const idx = sorted.findIndex(x=>x.id===item.id);
  const nextInEvent = sorted.slice(idx+1).find(x=>x.eventId===item.eventId);
  if(nextInEvent) return new Date(nextInEvent.time).getTime();
  const parentEvent = ev(item.eventId);
  if(parentEvent) return new Date(parentEvent.endTime).getTime();
  return start + 20*60000;
}

function spanEndOf(item){
  const kids = childrenOf(item.id);
  if(!kids.length) return endTimeOf(item);
  return Math.max(endTimeOf(item), endTimeOf(kids[kids.length-1]));
}
function durationOf(item, opts){
  const end = (opts && opts.rollup) ? spanEndOf(item) : endTimeOf(item);

}

function timelineQuery(opts){

  let items = allItemsSorted().filter(it=>visibleTo(it, viewer));

  if(o.rollup) items = items.filter(it=>!rollupParentOf(it));
  return items;

const PRIORITY_RANK = { urgent:0, high:1, normal:2, low:3 };
function priorityRank(p){ return PRIORITY_RANK[p] ?? 2; }
function isOverdue(task){
  return !!task.dueDate && task.status !== "done" && task.status !== "dismissed" &&
         new Date(task.dueDate+"T23:59:59") < now();
}
function isBlocking(task){
  if(task.status === "done" || task.status === "dismissed") return false;
  return task.priority === "urgent" || task.status === "blocked" || isOverdue(task);
}

function isDueSoon(task, days){
  if(!task.dueDate || task.status === "done" || task.status === "dismissed") return false;
  const due = new Date(task.dueDate+"T23:59:59").getTime();
  const nowT = now().getTime();
  const windowMs = (days || 3) * 24*60*60*1000;
  return due >= nowT && due <= nowT + windowMs;
}

function isDoNow(task){
  return isBlocking(task) || isDueSoon(task, 3);
}

function severityOf(task){
  if(task.priority === "urgent") return "red";
  if(task.priority === "high") return "yellow";
  if(task.priority === "low") return "gray";
  return "gray";
}
function severityRank(s){ return {red:0, yellow:1, blue:2, gray:3}[s] ?? 4; }




function allTasks(){
  if(!hasPlanning()) return [];
  return planning.tasks || [];
}
function openTasks(){ return allTasks().filter(t=>t.status !== "done" && t.status !== "dismissed"); }
function doneTasks(){ return allTasks().filter(t=>t.status === "done" || t.status === "dismissed"); }

function planningIssues(){ return openTasks().filter(isBlocking); }
function taskById(id){ return allTasks().find(t=>t.id === id); }

function taskScope(t){
  if(t.scopeEventId) return { type:"event", eventId:t.scopeEventId };
  if(t.blocksEventId) return { type:"event", eventId:t.blocksEventId };
  if(t.entityType === "event" && t.entityId) return { type:"event", eventId:t.entityId };
  return { type:"wedding" };
}
function taskEventId(t){ const s = taskScope(t); return s.type === "event" ? s.eventId : null; }

function tasksForEntity(type, id){
  if(type === "event") return openTasks().filter(t=>taskEventId(t) === id);
  return openTasks().filter(t=>t.entityType===type && t.entityId===id);
}
function sortTasks(list){
  return [...list].sort((a,b)=>
    priorityRank(a.priority)-priorityRank(b.priority) ||
    String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")) ||
    String(a.title).localeCompare(String(b.title))
  );
}
function planningReadiness(){
  const all = allTasks();
  return {
    total: all.length,
    done: all.filter(t=>t.status==="done").length,
    open: openTasks().length,
    blocking: planningIssues().length,
    daysOut: daysUntil(data.wedding.primaryDate)
  };
}

function createAuthoredTask(fields){
  if(!hasPlanning() || !fields.title || !fields.title.trim()) return null;
  if(!fields.ownerId) return null;
  const t = {
    id: "task_"+Math.random().toString(36).slice(2,10),
    source: "authored",
    title: fields.title.trim(),
    detail: fields.detail ? fields.detail.trim() : "",
    status: "open",
    priority: "normal",
    group: null,
    ownerId: fields.ownerId,
    dueDate: fields.dueDate || null
  };
  if(fields.scopeEventId){
    t.scopeEventId = fields.scopeEventId;
    t.blocksEventId = fields.scopeEventId;
  } else if(fields.scope === "wedding"){
    t.scope = "wedding";
  }
  if(fields.linkedTimelineItemId) t.linkedTimelineItemId = fields.linkedTimelineItemId;
  if(fields.entityType && fields.entityId){
    t.entityType = fields.entityType;
    t.entityId = fields.entityId;
    if(fields.entityType === "event" && !t.scopeEventId){ t.scopeEventId = fields.entityId; t.blocksEventId = fields.entityId; }
  }
  planning.tasks.push(t);
  persistPlanning();
  return t.id;
}

function createTaskOwner(name){
  const clean = String(name||"").trim().replace(/\s+/g," ");
  if(!clean) return null;
  const existing = data.people.find(p=>String(p.name||"").trim().toLowerCase()===clean.toLowerCase());
  if(existing) return existing.id;
  const slug = clean.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,32) || "owner";
  let id = `person_${slug}`;
  while(person(id)) id = `person_${slug}_${Math.random().toString(36).slice(2,6)}`;
  data.people.push({id, name:clean, role:"Wedding Team", phone:"", teamIds:[], hotel:"", notes:"", side:""});
  persistDataOverride();
  return id;
}

  const t = byId(planning.tasks, id);
  if(!t) return;
  t.status = status;
  if(status === "done") t.completedAt = now().toISOString().slice(0,10);
  else delete t.completedAt;
  persistPlanning();
}

function updateAuthoredTaskDetails(id, fields){
  const t = byId(planning.tasks, id);
  if(!t || t.source !== "authored") return false;
  if("ownerId" in fields) t.ownerId = fields.ownerId || null;
  if("dueDate" in fields) t.dueDate = fields.dueDate || null;
  if("scopeEventId" in fields){
    if(fields.scopeEventId){
      t.scopeEventId = fields.scopeEventId;
      t.blocksEventId = fields.scopeEventId;
      t.scope = null;
    } else {
      t.scopeEventId = null;
      t.blocksEventId = null;
      t.scope = "wedding";
      
      if(t.entityType === "event"){ t.entityType = null; t.entityId = null; }
    }
  }
  if("linkedTimelineItemId" in fields) t.linkedTimelineItemId = fields.linkedTimelineItemId || null;
  persistPlanning();
  return true;
}

    targetId: t.id
  }));
}




function dayOfIssues(){
  const t = now().getTime();
  const WINDOW = 24*60*60*1000;
  return sortTasks(planningIssues().filter(task=>{
    const eid = taskEventId(task);
    if(!eid) return false;
    const e = ev(eid);
    if(!e) return false;
    const start = new Date(e.startTime).getTime();
    const end = new Date(e.endTime).getTime();
    return (t >= start - WINDOW && t <= end) || (t >= start && t <= end);
  }));
}


function eventOfAssignmentTarget(a){
  if(a.targetType === "event") return ev(a.targetId);
  if(a.targetType === "timelineItem") return ev(tlItem(a.targetId)?.eventId);
  if(a.targetType === "vendor"){
    const todayIds = new Set(todaysEvents().map(e=>e.id));
    const v = vendor(a.targetId);
    const matchId = (v?.eventIds||[]).find(id=>todayIds.has(id));
    return matchId ? ev(matchId) : null;
  }
  return null;
}
function assignmentsToday(){
  const todayIds = new Set(todaysEvents().map(e=>e.id));
  if(!todayIds.size) return [];
  return allAssignments().filter(a=>{
    const e = eventOfAssignmentTarget(a);
    return e && todayIds.has(e.id);
  });
}


function weatherFor(eventId){ return ev(eventId)?.weatherNote || null; }
function weatherToday(){
  const e = todaysEvents()[0] || nextMajorEvent();

}

function minutesUntil(iso){ return Math.round((new Date(iso).getTime() - now().getTime()) / 60000); }
function countdownLabel(iso){
  const m = minutesUntil(iso);
  if(m <= 0) return "Starting now";
  if(m < 60) return `in ${m} min`;
  const h = Math.floor(m/60), r = m % 60;
  return r ? `in ${h}h ${r}m` : `in ${h}h`;
}


function assignmentCoverage(){
  const requiring = data.timelineItems.filter(t=>t.requiresAssignment);
  const covered = requiring.filter(t=>primaryAssignmentOf("timelineItem", t.id));
  return { total: requiring.length, covered: covered.length, missing: requiring.length - covered.length };
}

function missingResponsibilities(){
  const items = data.timelineItems.filter(t=>t.requiresAssignment && !primaryAssignmentOf("timelineItem", t.id));
  const events = data.events.filter(e=>(!e.ownerTeamIds || !e.ownerTeamIds.length) && !primaryAssignmentOf("event", e.id));
  return { items, events };
}


function vendorReadiness(v){
  if(v.checkedInAt) return "ready";
  if(v.arrival && now().getTime() >= new Date(v.arrival).getTime()) return "flagged";
  return "expected";
}
function vendorsActiveToday(){
  const today = todaysEvents();
  const ids = new Set();
  today.forEach(e=>(e.vendorIds||[]).forEach(id=>ids.add(id)));
  if(!ids.size){
    const nxt = nextMajorEvent();
    if(nxt) (nxt.vendorIds||[]).forEach(id=>ids.add(id));
  }
  return [...ids].map(vendor).filter(Boolean);
}


function coordinatesWithFor(personId){
  const items = timelineItemsForPerson(personId);
  const seen = new Map();
  items.forEach(item=>{
    assignmentsFor("timelineItem", item.id).forEach(a=>{
      const who = assigneeOf(a);
      if(!who || (who.type==="person" && who.id===personId)) return;
      const key = who.type+":"+who.id;
      if(!seen.has(key)) seen.set(key, {...who, itemTitle:item.title});
    });
    (item.vendorIds||[]).forEach(vid=>{
      const v = vendor(vid);
      if(!v) return;
      const key = "vendor:"+vid;
      if(!seen.has(key)) seen.set(key, {type:"vendor", id:vid, name:v.name, itemTitle:item.title});
    });
  });
  return [...seen.values()];
}

function nextTransportationToday(){
  const t = now().getTime();
  return allTransportation()
    .filter(tr => tr.departureTime && isSameDay(new Date(tr.departureTime), now()))
    .filter(tr => {
      const dep = new Date(tr.departureTime).getTime();
      const arr = tr.arrivalTime ? new Date(tr.arrivalTime).getTime() : dep + 45*60000;
      return t <= arr + 60*60000; // still relevant up to an hour after arrival
    })
    .sort((a,b)=>new Date(a.departureTime)-new Date(b.departureTime))[0] || null;
}

function dayOfResponsibilitiesForPerson(personId){
  const p = person(personId);
  if(!p) return [];
  const normalize = value => String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
  const fullName = normalize(p.name);
  const firstName = fullName.split(" ")[0];
  const uniqueFirst = data.people.filter(other=>normalize(other.name).split(" ")[0] === firstName).length === 1;
  return DAY_OF_RESPONSIBILITIES.filter(r=>r.owner.split(/\s*(?:\/|&|,|\band\b)\s*/i).some(owner=>{
    const name = normalize(owner);
    return name === fullName || (uniqueFirst && name === firstName);
  })).sort((a,b)=>new Date(a.time)-new Date(b.time));
}

function responsibilitiesForEvent(eventId){
  return DAY_OF_RESPONSIBILITIES.filter(r=>r.eventId===eventId).sort((a,b)=>new Date(a.time)-new Date(b.time));
}

    const url = URL.createObjectURL(blob);

    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed.data && normalizeDataShape(parsed.data)){

function taskWhyLabel(t){
  if(t.status === "blocked") return "Blocked";
  if(t.priority === "urgent") return "Urgent";
  const overdue = t.dueDate && t.status!=="done" && new Date(t.dueDate+"T23:59:59") < now();
  if(overdue) return "Overdue";
  const dueToday = t.dueDate && t.status!=="done" && isSameDay(new Date(t.dueDate+"T12:00:00"), now());
  if(dueToday) return "Due today";
  return "Open";
}

const VIDHI_EVENT_ID = "event_vidhi";

const MEHNDI_EVENT_ID = "event_mehndi";
function vidhiSideOf(item){
  const title = (item && item.title || "").trim();
  if(/^alex/i.test(title)) return "alex";
  if(/^jordan/i.test(title)) return "jordan";
  return null;
}

function vidhiMergeItem(sortedItems){
  let lastSideTime = null;
  sortedItems.forEach(it=>{
    if(!vidhiSideOf(it)) return;
    const tm = new Date(it.time).getTime();
    if(lastSideTime === null || tm > lastSideTime) lastSideTime = tm;
  });
  if(lastSideTime === null) return null;
  return sortedItems.find(it => new Date(it.time).getTime() > lastSideTime) || null;
}

function vidhiSideStatus(sortedItems, side, mergeItem, nowMs){
  const sideItems = sortedItems.filter(it=>vidhiSideOf(it)===side);
  let current = null, next = null;
  for(const it of sideItems){
    const tm = new Date(it.time).getTime();
    if(tm <= nowMs) current = it; else { next = it; break; }
  }
  if(!next && mergeItem) next = mergeItem;
  return { current, next };
}

function vidhiComputeTracks(items){
  const sorted = items.slice().sort((a,b)=> new Date(a.time) - new Date(b.time));
  const merge = vidhiMergeItem(sorted);
  if(!merge) return null;
  const nowMs = now().getTime();
  const isDual = nowMs < new Date(merge.time).getTime();
  const alex = vidhiSideStatus(sorted, "alex", merge, nowMs);
  const jordan = vidhiSideStatus(sorted, "jordan", merge, nowMs);
  if(!alex.current && !alex.next && !jordan.current && !jordan.next) return null;
  return { sorted, merge, isDual, alex, jordan };
}

  return `

function heroDayOf(liveItem, nextItem, currentEvent, liveEvent){
  const actionsHtml = `
    <div class="hero-actions">
      <button class="btn btn-primary" data-goto="timeline">${ICONS.timeline} Open Schedule</button>
      <button class="btn" data-open-drawer="emergencyContacts:">${ICONS.siren} Emergency Contacts</button>
    </div>
  `;

  
  const vidhiTracks = (currentEvent && currentEvent.id === VIDHI_EVENT_ID) ? vidhiComputeTracks(itemsForEvent(currentEvent.id)) : null;
  if(vidhiTracks && vidhiTracks.isDual){
    return vidhiDualHeroHtml(currentEvent, vidhiTracks, actionsHtml);
  }
  const vidhiTogetherSuffix = (vidhiTracks && !vidhiTracks.isDual) ? " · Together" : "";

  
  if(!liveItem && liveEvent){
    const nextEventFallback = nextItem ? null : nextUpcomingEvent();
    const subParts = [];
    if(nextItem) subParts.push(`Next: ${esc(nextItem.title)} ${countdownLabel(nextItem.time)}`);
    else if(nextEventFallback) subParts.push(`Next: ${esc(nextEventFallback.title)} ${countdownLabel(nextEventFallback.startTime)}`);
    return `
      <div class="hero">
        <div class="hero-eyebrow is-live">Live Now${vidhiTogetherSuffix}</div>
        <div class="hero-big">${esc(liveEvent.title)}</div>
        <p class="hero-sub">${subParts.length ? subParts.join(" · ") : "In progress"}</p>
        ${actionsHtml}
      </div>
    `;
  }

  if(liveItem){
    const eff = effectiveStatus(liveItem);
    const meta = statusMeta(eff);
    
    const linkedCount = linkedTaskCountFor(liveItem);
    const subParts = [meta.label];
    if(linkedCount) subParts.push(`${linkedCount} linked task${linkedCount===1?'':'s'}`);
    if(nextItem) subParts.push(`Next: ${esc(nextItem.title)} ${countdownLabel(nextItem.time)}`);
    return `
      <div class="hero">
        <div class="hero-eyebrow is-live">Live Now · ${esc(currentEvent?.title||"")}${vidhiTogetherSuffix}</div>
        <div class="hero-big">${esc(liveItem.title)}</div>
        <p class="hero-sub">${subParts.join(" · ")}</p>
        ${actionsHtml}
      </div>
    `;
  }

  
  const today = todaysEvents();
  const dayLabel = fmtDate(now(), {weekday:'long', month:'long', day:'numeric'});
  const compactDayLabel = fmtDate(now(), {weekday:'short', month:'short', day:'numeric'});
  const todayNotStarted = today.length && today.every(e=>new Date(e.startTime) > now());
  const todayWrappedUp = today.length && today.every(e=>new Date(e.endTime) <= now());
  const gapSubhead = !today.length ? "A quieter day between events."
    : todayNotStarted ? "Today's events haven't started yet."
    : todayWrappedUp ? "Today's events have wrapped up."
    : "A short break between today's events.";
  const subParts = [gapSubhead];
  if(nextItem) subParts.push(`Next: ${esc(nextItem.title)} ${countdownLabel(nextItem.time)}`);
  else { const nextEventFallback = nextUpcomingEvent(); if(nextEventFallback) subParts.push(`Next: ${esc(nextEventFallback.title)} ${countdownLabel(nextEventFallback.startTime)}`); }
  return `
    <div class="hero">
      <div class="hero-eyebrow hero-week-banner"><span>Wedding Week · <span class="hero-week-date-full">${dayLabel}</span><span class="hero-week-date-compact">${compactDayLabel}</span></span></div>
      <div class="hero-big">${today.length ? esc(today.map(e=>e.title).join(" + ")) : "No events scheduled today"}</div>
      <p class="hero-sub">${subParts.join(" · ")}</p>
      ${actionsHtml}
    </div>
  `;
}

function timelinePhasesForEvent(eventId, items){
  const definitions = TIMELINE_PHASE_DEFINITIONS[eventId] || [];
  const phases = definitions.map((d, index)=>({...d, id:eventId+"-phase-"+index, items:[]}));
  const added = {id:eventId+"-phase-added", label:"Added Items", from:null, to:null, items:[]};
  items.forEach(item=>{
    const sourceRow = typeof item.sourceRow === "number" ? item.sourceRow : null;
    const phase = sourceRow == null ? added : phases.find(p=>sourceRow>=p.from && sourceRow<=p.to);
    (phase || added).items.push(item);
  });
  if(added.items.length) phases.push(added);
  return phases.filter(p=>p.items.length);
}

function concurrentTimelineGroups(items){
  const groups = [];
  items.forEach(item=>{
    const label = displayTimeLabel(item);
    const last = groups[groups.length-1];
    if(last && last.label === label) last.items.push(item);
    else groups.push({label, items:[item]});
  });
  return groups;
}

function renderOpsPhase(phase, open){
  const complete = phase.items.filter(i=>effectiveStatus(i)==="complete").length;
  const current = phase.items.filter(i=>effectiveStatus(i)==="current").length;
  const groups = concurrentTimelineGroups(phase.items);
  const firstTime = displayTimeLabel(phase.items[0]);
  const statusText = current ? "Happening now" : (complete===phase.items.length ? "Completed" : `${phase.items.length-complete} remaining`);
  return `
    <details class="ops-phase ${current?'is-current':''} ${complete===phase.items.length?'is-complete':''}" ${open?'open':''} data-ops-phase="${phase.id}">
      <summary class="ops-phase-summary">
        <span class="ops-phase-marker">${complete===phase.items.length ? ICONS.checkCircle : ICONS.timeline}</span>
        <span class="ops-phase-heading">
          <span class="ops-phase-title">${esc(phase.label)}</span>
          <span class="ops-phase-time">Starts ${esc(firstTime)} · ${phase.items.length} ${phase.items.length===1?'activity':'activities'}</span>
        </span>
        <span class="ops-phase-status">${esc(statusText)}</span>

      </summary>
      <div class="ops-phase-body">

function renderOpsRunSheet(eventId, items){
  const phases = timelinePhasesForEvent(eventId, items);
  const activeIndex = phases.findIndex(p=>p.items.some(i=>effectiveStatus(i)==="current"));
  const firstIncompleteIndex = phases.findIndex(p=>p.items.some(i=>effectiveStatus(i)!=="complete"));
  
  const eventIsCurrent = currentLiveEvent()?.id === eventId;
  const defaultOpenIndex = eventIsCurrent
    ? (activeIndex>=0 ? activeIndex : (firstIncompleteIndex>=0 ? firstIncompleteIndex : Math.max(0, phases.length-1)))
    : -1;
  return `<div class="ops-run-sheet" id="tl-full-list">
    ${renderOpsFocusStrip(items)}
    <div class="ops-phase-list">${phases.map((phase,index)=>renderOpsPhase(phase,index===defaultOpenIndex)).join("")}</div>
  </div>`;
}

function contactRowHtml(kind, it){

  const role = kind === "vendor" ? (it.type || "Vendor")
    : kind === "venue" ? (it.kind === "hotel" ? "Hotel" : "Venue")
    : kind === "team" ? (it.mission || "Wedding team")
    : (it.role || "");
  const phone = it.phone || "";
  const contactLines = kind === "vendor"
    ? [{name:it.contactName, phone}, ...(it.additionalContacts||[])].filter(c=>c.name||c.phone)
    : (phone || it.contactName ? [{name:it.contactName, phone}] : []);

        <div class="vcard-role">${esc(role)}</div>
        ${contactLines.map(c=>`<div class="vcard-meta">${esc([c.name, c.phone].filter(Boolean).join(" · "))}</div>`).join("")}

      ${phone ? `
        <div class="vcard-actions">
          <button class="circle-btn" data-call="${esc(phone)}" aria-label="Call ${esc(name)}">${ICONS.phone}</button>
          <button class="circle-btn" data-text="${esc(phone)}" aria-label="Message ${esc(name)}">${ICONS.message}</button>
        </div>
      ` : ""}
    </div>
  `;
}

function buildSearchIndex(){
  const idx = [];
  data.people.forEach(p=>idx.push({type:"person", id:p.id, title:p.name, sub:p.role}));
  data.teams.forEach(t=>idx.push({type:"team", id:t.id, title:t.name, sub:t.mission}));
  data.vendors.forEach(v=>idx.push({type:"vendor", id:v.id, title:v.name, sub:v.type}));
  data.events.forEach(e=>idx.push({type:"event", id:e.id, title:e.title, sub:e.subtitle}));
  data.timelineItems.forEach(t=>idx.push({type:"timelineItem", id:t.id, title:t.title, sub:(ev(t.eventId)?.title||"")+" · "+fmtDateTimeShort(t.time)}));
  data.venues.forEach(v=>idx.push({type:"venue", id:v.id, title:v.name, sub:v.address||"Address TBD"}));
  data.contacts.forEach(c=>idx.push({type:"contact", id:c.id, title:c.name, sub:c.role}));
  if(state.planningMode){
    
    openTasks().forEach(t=>idx.push({type:"task", id:t.id, title:t.title, sub:t.detail}));
  }
  return idx;
}
const TYPE_LABEL = {person:"People", team:"Teams", vendor:"Vendors", event:"Events", timelineItem:"Schedule", venue:"Venues", contact:"Contacts", task:"To Do", decision:"Decisions"};

function openSearch(){
  const overlay = document.getElementById("search-overlay");
  overlay.classList.add("open");
  overlay.removeAttribute("aria-hidden");
  const input = document.getElementById("search-input");
  state.searchQuery = "";
  input.value = "";
  renderSearchResults("");
  setTimeout(()=>input.focus(), 30);
}
function closeSearch(){
  const overlay = document.getElementById("search-overlay");
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  if(document.activeElement && overlay.contains(document.activeElement)) document.activeElement.blur();
}
function renderSearchResults(query){
  const idx = buildSearchIndex();
  const q = query.trim().toLowerCase();
  const results = q ? idx.filter(r=> r.title.toLowerCase().includes(q) || (r.sub||"").toLowerCase().includes(q)) : idx.slice(0,0);
  const container = document.getElementById("search-results");
  if(!q){
    container.innerHTML = `<div class="search-empty">Start typing to search people, teams, vendors, events, venues, contacts, and issues.</div>`;
    return;
  }
  if(results.length===0){
    container.innerHTML = `<div class="search-empty">No matches for "${esc(query)}"</div>`;
    return;
  }
  const groups = {};
  results.forEach(r=>{ (groups[r.type] = groups[r.type]||[]).push(r); });
  container.innerHTML = Object.keys(groups).map(type=>`
    <div class="search-group-title">${TYPE_LABEL[type]}</div>
    ${groups[type].map(r=>`
      <div class="search-result" data-open-drawer="${r.type}:${r.id}">
        <div class="search-result-icon">${TYPE_ICON[r.type]}</div>
        <div>
          <div class="search-result-title">${esc(r.title)}</div>
          <div class="search-result-sub">${esc(r.sub||"")}</div>
        </div>
      </div>
    `).join("")}
  `).join("");
  container.querySelectorAll("[data-open-drawer]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const raw = el.getAttribute("data-open-drawer");
      const cut = raw.indexOf(":");
      closeSearch();
      openDrawer(raw.slice(0, cut), raw.slice(cut+1));
    });
  });
}


function wireDrawerTriggers(scope){
  scope.querySelectorAll("[data-open-drawer]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      
      const raw = el.getAttribute("data-open-drawer");
      const cut = raw.indexOf(":");
      openDrawer(raw.slice(0, cut), raw.slice(cut+1));
    });
  });
}

function openDrawer(type, id){
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("drawer-overlay");
  drawer.innerHTML = renderDrawerContent(type, id);
  overlay.classList.add("open");
  drawer.classList.add("open");
  drawer.removeAttribute("aria-hidden");
  
  drawer.querySelectorAll("audio").forEach(a=>{ try{ a.load(); }catch(err){} });
  wireDrawerTriggers(drawer);
  wirePhotoGroupSearch(drawer);
  drawer.querySelectorAll("[data-drawer-close]").forEach(b=>b.addEventListener("click", closeDrawer));
  drawer.querySelectorAll("[data-call]").forEach(b=>b.addEventListener("click", ()=>window.location.href=telHref(b.getAttribute("data-call"))));
  drawer.querySelectorAll("[data-text]").forEach(b=>b.addEventListener("click", ()=>window.location.href=smsHref(b.getAttribute("data-text"))));
  wirePlanningDrawer(drawer, type, id);
  wireDayOfDrawer(drawer, type, id);
  wireBriefToggle(drawer, ()=>openDrawer(type, id));
  drawer.querySelectorAll("[data-drawer-nav]").forEach(b=>b.addEventListener("click", ()=>{
    const g = b.getAttribute("data-drawer-nav");
    
    const section = b.getAttribute("data-drawer-nav-section");
    if(g === "directory" && section){ closeDrawer(); openDirectorySection(section); return; }
    closeDrawer();
    
    if(g === "eventHub"){
      
      state.missionDrill = "event";
      state.missionEventId = b.getAttribute("data-drawer-nav-event");
      state.eventHubSection = null;
      state.view = "manage";
      renderShell(); renderActiveView();
      return;
    }
    
    if(g === "timeline") state.timelineEventId = b.getAttribute("data-drawer-nav-event") || null;
    state.view = g;
    renderShell(); renderActiveView();
  }));
  drawer.focus();
}
function closeDrawer(){
  const drawer = document.getElementById("drawer");
  drawer.classList.remove("open");
  document.getElementById("drawer-overlay").classList.remove("open");

}

const PLANNING_RECORD_TYPES = new Set(["task","decision","note"]);

const PLANNING_NOTES_OWNED_ELSEWHERE = new Set(["timelineItem"]);

const CONTACT_DRAWER_TYPES = new Set(["contact","contactPerson","contactVendor","contactVenue"]);

function notesComposerHtml(type, id){
  const notes = notesFor(type, id);
  let html = notes.length
    ? notes.map(n=>`<div class="pnote"><div class="pnote-body">${esc(n.body)}</div><div class="pnote-meta">${esc(n.createdDate)}</div></div>`).join("")
    : `<p style="color:var(--ink-faint); font-size:13px;">No notes yet.</p>`;
  if(hasPlanning() && state.planningMode){
    html += `<div class="pnote-add"><input class="pinput" id="note-input" type="text" placeholder="Add a note…"><button class="btn btn-sm" id="note-save">Add</button></div>`;
  }
  return html;
}

function planningContextHtml(type, id){
  if(!hasPlanning() || !state.planningMode || PLANNING_RECORD_TYPES.has(type) || CONTACT_DRAWER_TYPES.has(type) || type === "timelineItem" || type === "newTask" || type === "transportation" || type === "newTransportation" || type === "newTimelineItem" || type === "emergencyContacts" || type === "photoGroups") return "";
  const tasks = sortTasks(tasksForEntity(type, id));
  let html = `<div class="drawer-section">
    <div class="drawer-section-title">Related Tasks</div>
    ${tasks.length ? `<div class="pgroup-list">${tasks.map(renderTaskRow).join("")}</div>` : `<p style="color:var(--ink-faint); font-size:13px;">Nothing outstanding here.</p>`}
    <button class="btn btn-sm" style="margin-top:10px;" data-open-drawer="newTask:${type}:${id}">+ Add task</button>
  </div>`;
  if(!PLANNING_NOTES_OWNED_ELSEWHERE.has(type)){
    html += `<div class="drawer-section">
      <div class="drawer-section-title">Notes</div>
      ${notesComposerHtml(type, id)}
    </div>`;
  }
  return html;
}
function renderDrawerContent(type, id){
  const html = baseDrawerContent(type, id);
  const extra = planningContextHtml(type, id);
  if(!extra) return html;
  const marker = '<div class="drawer-actions">';
  const at = html.indexOf(marker);
  return at === -1 ? html + extra : html.slice(0, at) + extra + html.slice(at);
}
function baseDrawerContent(type, id){
  switch(type){
    case "vendor": return drawerVendor(vendor(id));
    case "person": return drawerPerson(person(id));
    case "team": return drawerTeam(team(id));
    case "event": return drawerEvent(ev(id));
    case "timelineItem": return drawerTimelineItem(tlItem(id));
    case "venue": return drawerVenue(venueOf(id));
    case "contact": return drawerContact(contactOf(id));
    
    case "contactPerson": return drawerContactPerson(person(id));
    case "contactVendor": return drawerContactVendor(vendor(id));
    case "contactVenue": return drawerContactVenue(venueOf(id));
    case "task": return drawerTask(taskById(id));
    case "decision": return drawerDecision(decisionOf(id));
    case "note": return drawerNote(id);
    case "newTask": return drawerNewTask(id);
    case "transportation": return drawerTransportation(transportationById(id));
    case "newTransportation": return drawerNewTransportation(id);
    case "newTimelineItem": return drawerNewTimelineItem(id);
    case "emergencyContacts": return drawerEmergencyContacts();
    case "photoGroups": return drawerPhotoGroups();
    default: return `<div class="drawer-close-row"><button class="icon-btn" data-drawer-close>${ICONS.close}</button></div><p>Not found.</p>`;
  }
}
