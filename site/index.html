<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Event Ops Operations">
<title>Event Operations — Interactive Portfolio Demo</title>

<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="portfolio-demo-banner" role="note">PORTFOLIO DEMO · Fictional data · Changes stay in this browser · Privacy-preserving regional analytics enabled.</div>

<div id="app"></div>


<div class="overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
  <div class="overlay-panel">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search people, vendors, events, venues…" autocomplete="off" aria-label="Search Event Ops Event Operations">
      <button class="search-close" id="search-close-btn">Close</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>


<div class="overlay" id="seating-overlay" role="dialog" aria-modal="true" aria-label="Reception Seating" aria-hidden="true">
  <div class="overlay-panel seating-panel">
    <div class="seating-panel-head">
      <div>
        <div class="family-reference-eyebrow">Reception</div>
        <div class="family-reference-title">Find a Guest's Table</div>
        <p>Search a name, or browse the tables below.</p>
      </div>
      <button class="search-close" id="seating-close-btn">Close</button>
    </div>
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="seating-search-input" type="text" placeholder="Search a guest's name…" autocomplete="off" aria-label="Search reception seating by guest name">
    </div>
    <div class="seating-match" id="seating-match" hidden aria-live="polite"></div>
    <div class="seating-tables" id="seating-tables"></div>
  </div>
</div>


<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true" tabindex="-1"></div>

<div class="toast" id="toast"></div>

<script src="/applicationinsights-web.min.js"></script>
<script src="/telemetry.js"></script>
<script src="/app.js" defer></script>
</body>
</html>
